name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without v), e.g. 0.1.0'
        required: false

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF: ${{ github.ref_name }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          elif [ -n "${REF}" ]; then
            VERSION="${REF#v}"
          else
            echo "requires a version input or a v* tag" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.os }}/${{ matrix.arch }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            ext: .exe
            runner: windows-latest
          - os: linux
            arch: amd64
            ext: ''
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            ext: ''
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            ext: ''
            runner: macos-15
          - os: darwin
            arch: arm64
            ext: ''
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Build
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          FEED_URL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        run: |
          set -euo pipefail
          TAGS="production"
          FLAGS="-s -w -X main.version=${VERSION} -X github.com/menghun3-cn/go-gui-template/internal/update.defaultFeed=${FEED_URL}"
          if [ "${{ matrix.os }}" = "linux" ]; then
            TAGS="${TAGS} gtk3"
            export CGO_ENABLED=1
          elif [ "${{ matrix.os }}" = "darwin" ]; then
            export CGO_ENABLED=1
          else
            export CGO_ENABLED=0
            FLAGS="${FLAGS} -H windowsgui"
          fi
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
            go build -tags "${TAGS}" -trimpath -ldflags "${FLAGS}" \
            -o dist/gogui-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/gogui

      - name: Sign Windows executable
        if: runner.os == 'Windows'
        env:
          CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:CERT) {
            Write-Host "::warning::WINDOWS_SIGNING_CERT not configured; skipping Windows Authenticode signing"
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "gogui-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
          $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if (-not $signtool) {
            $candidates = @(
              "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe",
              "C:\Program Files\Windows Kits\10\bin\*\x64\signtool.exe"
            )
            foreach ($pattern in $candidates) {
              $found = Get-ChildItem $pattern -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $signtool = $found; break }
            }
          }
          if (-not $signtool) {
            throw "signtool.exe not found"
          }
          & $signtool.Source sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /v "dist/gogui-windows-amd64.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "signtool failed with exit code $LASTEXITCODE"
          }

      - name: Sign and notarize macOS app
        if: runner.os == 'macOS'
        env:
          APPLE_CERT: ${{ secrets.APPLE_CERT }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          if [ -z "$APPLE_CERT" ]; then
            echo "::warning::APPLE_CERT not configured; skipping codesign/notarization"
            exit 0
          fi
          # TODO: import the Developer ID cert, run codesign, then notarytool submit.

      - uses: actions/upload-artifact@v4
        with:
          name: gogui-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/gogui-*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate update feed
        shell: pwsh
        env:
          GH_REPO: ${{ github.repository }}
          GH_REF: ${{ needs.version.outputs.tag }}
        run: |
          ./scripts/generate-feed.ps1 `
            -DistPath "$PWD/dist" `
            -Version "$env:GH_REF" `
            -Repo "$env:GH_REPO" `
            -OutFile "$PWD/dist/latest.json"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/gogui-*
            dist/latest.json
